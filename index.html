<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <style>
        :root {
            font-family: Inter, system-ui, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 16px;
        }

        .app {
            width: min(100%, 520px);
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .header {
            padding: 32px 28px 20px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #fff;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 1.75rem;
            letter-spacing: 0.04em;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
            line-height: 1.55;
        }

        .new-task {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin: 0 auto;
            padding: 24px 28px 30px;
        }

        .new-task input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
        }

        .new-task input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .new-task button {
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            background: #4338ca;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .new-task button:hover {
            background: #3730a3;
        }

        .todo-list {
            list-style: none;
            margin: 0;
            padding: 0 28px 24px;
        }

        .todo-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item label {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .todo-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #4338ca;
            cursor: pointer;
        }

        .todo-text {
            font-size: 1rem;
            word-break: break-word;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #6b7280;
        }

        .todo-actions {
            display: flex;
            gap: 6px;
        }

        .todo-actions button {
            border: none;
            background: transparent;
            color: #6b7280;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .todo-actions button:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .status-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 28px 24px;
            border-top: 1px solid #e5e7eb;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filters button,
        .clear-completed {
            border: 1px solid #d1d5db;
            background: #fff;
            color: #374151;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .filters button.active,
        .clear-completed:hover,
        .filters button:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .filters button.active {
            border-color: #6366f1;
            color: #4338ca;
        }

        .footer {
            padding: 18px 28px 28px;
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 520px) {
            .app {
                border-radius: 20px;
            }

            .new-task,
            .todo-list,
            .status-bar,
            .footer {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Todo list application">
        <section class="header">
            <h1>Todo List</h1>
            <p>Fast, accessible, and persistent tasks. Add, complete, edit, filter, and store your list locally.</p>
        </section>

        <section class="new-task">
            <input id="taskInput" type="text" placeholder="Add a new task..." aria-label="New task description" />
            <button id="addTaskButton" type="button">Add</button>
        </section>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <div class="status-bar">
            <div id="taskCount">0 tasks left</div>
            <div class="filters" role="group" aria-label="Task filters">
                <button type="button" data-filter="all" class="active">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>
            <button class="clear-completed" id="clearCompleted">Clear completed</button>
        </div>

        <div class="footer">
            Tip: Double-click a task to edit it, or click the edit icon. Your list stays saved in this browser.
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addTaskButton = document.getElementById('addTaskButton');
        const todoList = document.getElementById('todoList');
        const taskCount = document.getElementById('taskCount');
        const clearCompletedButton = document.getElementById('clearCompleted');
        const filterButtons = document.querySelectorAll('.filters button');

        const STORAGE_KEY = 'todoAppTasks';
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let currentFilter = 'all';

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function formatTaskCount(count) {
            return `${count} task${count === 1 ? '' : 's'} left`;
        }

        function createTaskElement(task) {
            const item = document.createElement('li');
            item.className = 'todo-item';
            item.dataset.id = task.id;

            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.setAttribute('aria-label', `Mark task ${task.description} as completed`);

            const text = document.createElement('span');
            text.className = 'todo-text' + (task.completed ? ' completed' : '');
            text.textContent = task.description;
            text.tabIndex = 0;
            text.title = 'Double-click or press Enter to edit';

            const actions = document.createElement('div');
            actions.className = 'todo-actions';

            const editButton = document.createElement('button');
            editButton.type = 'button';
            editButton.innerHTML = '✎';
            editButton.title = 'Edit task';

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.innerHTML = '🗑';
            deleteButton.title = 'Delete task';

            label.appendChild(checkbox);
            label.appendChild(text);
            item.appendChild(label);
            actions.appendChild(editButton);
            actions.appendChild(deleteButton);
            item.appendChild(actions);

            checkbox.addEventListener('change', () => {
                task.completed = checkbox.checked;
                text.classList.toggle('completed', task.completed);
                saveTasks();
                renderTasks();
            });

            function beginEdit() {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = task.description;
                input.className = 'todo-edit-input';
                input.style.width = '100%';
                input.style.padding = '8px 10px';
                input.style.fontSize = '1rem';
                input.style.borderRadius = '12px';
                input.style.border = '1px solid #d1d5db';

                text.replaceWith(input);
                input.focus();
                input.select();

                function finishEdit() {
                    const newDescription = input.value.trim();
                    if (newDescription) {
                        task.description = newDescription;
                        saveTasks();
                    }
                    renderTasks();
                }

                input.addEventListener('blur', finishEdit);
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        finishEdit();
                    } else if (event.key === 'Escape') {
                        renderTasks();
                    }
                });
            }

            editButton.addEventListener('click', beginEdit);
            text.addEventListener('dblclick', beginEdit);
            text.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    beginEdit();
                }
            });

            deleteButton.addEventListener('click', () => {
                tasks = tasks.filter((item) => item.id !== task.id);
                saveTasks();
                renderTasks();
            });

            return item;
        }

        function renderTasks() {
            todoList.innerHTML = '';
            const filteredTasks = tasks.filter((task) => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            filteredTasks.forEach((task) => todoList.appendChild(createTaskElement(task)));
            const remaining = tasks.filter((task) => !task.completed).length;
            taskCount.textContent = formatTaskCount(remaining);
            clearCompletedButton.disabled = tasks.every((task) => !task.completed);

            filterButtons.forEach((button) => {
                button.classList.toggle('active', button.dataset.filter === currentFilter);
            });
        }

        addTaskButton.addEventListener('click', () => {
            const description = taskInput.value.trim();
            if (!description) return;
            tasks.unshift({
                id: Date.now().toString(),
                description,
                completed: false,
            });
            taskInput.value = '';
            saveTasks();
            renderTasks();
            taskInput.focus();
        });

        taskInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                addTaskButton.click();
            }
        });

        filterButtons.forEach((button) => {
            button.addEventListener('click', () => {
                currentFilter = button.dataset.filter;
                renderTasks();
            });
        });

        clearCompletedButton.addEventListener('click', () => {
            tasks = tasks.filter((task) => !task.completed);
            saveTasks();
            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
