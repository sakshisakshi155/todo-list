<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app" role="application" aria-label="Todo list application">
        <nav class="navbar" aria-label="Main navigation">
            <div class="logo">Todo List</div>
            <div class="nav-links">
                <button type="button" class="nav-button">Home</button>
                <button type="button" class="nav-button">Tasks</button>
                <button type="button" class="nav-button">About</button>
            </div>
        </nav>

        <section class="header">
            <h1>Todo List</h1>
            <p>Fast, accessible, and persistent tasks. Add, complete, edit, filter, and store your list locally.</p>
        </section>

        <section class="new-task">
            <input id="taskInput" type="text" placeholder="Add a new task..." aria-label="New task description" />
            <button id="addTaskButton" type="button">Add</button>
        </section>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <div class="status-bar">
            <div id="taskCount">0 tasks left</div>
            <div class="filters" role="group" aria-label="Task filters">
                <button type="button" data-filter="all" class="active">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>
            <button class="clear-completed" id="clearCompleted">Clear completed</button>
        </div>

        <div class="footer">
            Tip: Double-click a task to edit it, or click the edit icon. Your list stays saved in this browser.
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addTaskButton = document.getElementById('addTaskButton');
        const todoList = document.getElementById('todoList');
        const taskCount = document.getElementById('taskCount');
        const clearCompletedButton = document.getElementById('clearCompleted');
        const filterButtons = document.querySelectorAll('.filters button');

        const STORAGE_KEY = 'todoAppTasks';
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let currentFilter = 'all';

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function formatTaskCount(count) {
            return `${count} task${count === 1 ? '' : 's'} left`;
        }

        function createTaskElement(task) {
            const item = document.createElement('li');
            item.className = 'todo-item';
            item.dataset.id = task.id;

            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.setAttribute('aria-label', `Mark task ${task.description} as completed`);

            const text = document.createElement('span');
            text.className = 'todo-text' + (task.completed ? ' completed' : '');
            text.textContent = task.description;
            text.tabIndex = 0;
            text.title = 'Double-click or press Enter to edit';

            const actions = document.createElement('div');
            actions.className = 'todo-actions';

            const editButton = document.createElement('button');
            editButton.type = 'button';
            editButton.innerHTML = '✎';
            editButton.title = 'Edit task';

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.innerHTML = '🗑';
            deleteButton.title = 'Delete task';

            label.appendChild(checkbox);
            label.appendChild(text);
            item.appendChild(label);
            actions.appendChild(editButton);
            actions.appendChild(deleteButton);
            item.appendChild(actions);

            checkbox.addEventListener('change', () => {
                task.completed = checkbox.checked;
                text.classList.toggle('completed', task.completed);
                saveTasks();
                renderTasks();
            });

            function beginEdit() {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = task.description;
                input.className = 'todo-edit-input';
                input.style.width = '100%';
                input.style.padding = '8px 10px';
                input.style.fontSize = '1rem';
                input.style.borderRadius = '12px';
                input.style.border = '1px solid #d1d5db';

                text.replaceWith(input);
                input.focus();
                input.select();

                function finishEdit() {
                    const newDescription = input.value.trim();
                    if (newDescription) {
                        task.description = newDescription;
                        saveTasks();
                    }
                    renderTasks();
                }

                input.addEventListener('blur', finishEdit);
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        finishEdit();
                    } else if (event.key === 'Escape') {
                        renderTasks();
                    }
                });
            }

            editButton.addEventListener('click', beginEdit);
            text.addEventListener('dblclick', beginEdit);
            text.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    beginEdit();
                }
            });

            deleteButton.addEventListener('click', () => {
                tasks = tasks.filter((item) => item.id !== task.id);
                saveTasks();
                renderTasks();
            });

            return item;
        }

        function renderTasks() {
            todoList.innerHTML = '';
            const filteredTasks = tasks.filter((task) => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            filteredTasks.forEach((task) => todoList.appendChild(createTaskElement(task)));
            const remaining = tasks.filter((task) => !task.completed).length;
            taskCount.textContent = formatTaskCount(remaining);
            clearCompletedButton.disabled = tasks.every((task) => !task.completed);

            filterButtons.forEach((button) => {
                button.classList.toggle('active', button.dataset.filter === currentFilter);
            });
        }

        addTaskButton.addEventListener('click', () => {
            const description = taskInput.value.trim();
            if (!description) return;
            tasks.unshift({
                id: Date.now().toString(),
                description,
                completed: false,
            });
            taskInput.value = '';
            saveTasks();
            renderTasks();
            taskInput.focus();
        });

        taskInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                addTaskButton.click();
            }
        });

        filterButtons.forEach((button) => {
            button.addEventListener('click', () => {
                currentFilter = button.dataset.filter;
                renderTasks();
            });
        });

        clearCompletedButton.addEventListener('click', () => {
            tasks = tasks.filter((task) => !task.completed);
            saveTasks();
            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
